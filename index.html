<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Index</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
  h1 { font-size: 1.4em; }
  #repo-link { font-size: 0.85em; color: #888; }
  #repo-link a { color: inherit; }
  #status { color: #888; }
  ul { list-style: none; padding-left: 0; }
  li { margin: 4px 0; }
  a { text-decoration: none; color: #0366d6; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1 id="title">Repo Index</h1>
<div id="repo-link"></div>
<div id="status">불러오는 중...</div>
<div id="tree"></div>

<script>
// 현재 주소에서 owner/repo를 추출한다 (하드코딩 금지).
// 프로젝트 페이지 형태: https://{owner}.github.io/{repo}/...
function getOwnerRepo() {
  const owner = location.hostname.split(".")[0] || "";
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  return { owner, repo };
}

async function main() {
  const titleEl = document.getElementById("title");
  const repoLinkEl = document.getElementById("repo-link");
  const statusEl = document.getElementById("status");
  const treeEl = document.getElementById("tree");

  const { owner, repo } = getOwnerRepo();
  if (repo) {
    document.title = repo;
    titleEl.textContent = repo;
    const a = document.createElement("a");
    a.href = `https://github.com/${owner}/${repo}`;
    a.textContent = `${owner}/${repo}`;
    repoLinkEl.appendChild(a);
  }

  try {
    const res = await fetch("pages.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`pages.json 로드 실패: ${res.status}`);
    const folders = await res.json();
    statusEl.remove();

    if (folders.length === 0) {
      treeEl.textContent = "등록된 항목이 없습니다.";
      return;
    }

    const ul = document.createElement("ul");
    folders.forEach(folderPath => {
      const encodedPath = folderPath.split("/").map(encodeURIComponent).join("/");
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = encodedPath + "/";
      a.textContent = folderPath;
      li.appendChild(a);
      ul.appendChild(li);
    });
    treeEl.appendChild(ul);
  } catch (err) {
    statusEl.textContent = "목록을 불러오지 못했습니다: " + err.message;
  }
}

main();
</script>

</body>
</html>
